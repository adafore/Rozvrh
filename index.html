<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zvonění</title>
<style>
:root{--bg:#0e1726;--panel:#16233a;--line:#26364f;--text:#e8edf5;--muted:#8fa0b8;--accent:#ffb400;--ink:#1a1300}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Bahnschrift,"Segoe UI",system-ui,sans-serif;line-height:1.4}
main{max-width:760px;margin:0 auto;padding:16px 14px 48px}
#box{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:48px 16px 40px;text-align:center;cursor:pointer;user-select:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
#label{color:var(--muted);font-size:1.05rem;margin-bottom:6px}
#time{font-size:clamp(3rem,17vw,7.5rem);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
#info{position:absolute;top:12px;left:16px;font-size:.85rem;color:var(--muted);text-align:left}
#info b{color:var(--text);font-weight:600}
#fs{position:absolute;right:14px;bottom:10px;font-size:.72rem;color:var(--muted)}
#box.ring{background:var(--accent);color:var(--ink);border-color:var(--accent);animation:shake .5s infinite}
#box.ring #label,#box.ring #info,#box.ring #fs{display:none}
#box.ring #time{font-size:clamp(3rem,20vw,9rem);letter-spacing:0}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.2deg)}75%{transform:rotate(1.2deg)}}
#box:fullscreen{border:0;border-radius:0;background:var(--bg);width:100vw;height:100vh}
#box:fullscreen #time{font-size:min(24vw,38vh)}
#box:fullscreen #label{font-size:clamp(1.2rem,3vw,2.4rem)}
#box:fullscreen #info{font-size:clamp(1rem,2.2vw,1.8rem);top:24px;left:28px}
#box:fullscreen #fs{display:none}
#box.ring:fullscreen{background:var(--accent)}
#box.ring:fullscreen #time{font-size:min(28vw,45vh)}
h2{font-size:1.1rem;margin:28px 0 10px;font-weight:600}
ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
li{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:baseline;padding:10px 12px;background:var(--panel);border-radius:10px;border-left:4px solid transparent}
li time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
li b{font-weight:600}
li span{color:var(--muted);font-size:.85rem}
li.now{border-left-color:var(--accent);background:#1d2f4d}
li.next{border-left-color:var(--muted)}
.empty{color:var(--muted);padding:10px 2px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:.8rem}
th,td{border:1px solid var(--line);padding:5px 3px;text-align:center;vertical-align:middle}
th{background:var(--panel);font-weight:600}
th.today{background:var(--accent);color:var(--ink)}
td.h{width:44px;color:var(--muted);font-size:.68rem;background:var(--panel)}
td.l{background:#1a2b46}
td.l.today{background:#27406a}
td.l b{display:block;font-size:1rem}
td.l small{color:var(--muted);font-size:.68rem}
@media (prefers-reduced-motion:reduce){#box.ring{animation:none}}
</style>
</head>
<body>
<main>
  <div id="box" role="timer" title="Klikni pro celou obrazovku">
    <div id="info"></div>
    <div id="label"></div>
    <div id="time">--:--</div>
    <div id="fs">klik = celá obrazovka</div>
  </div>
  <h2 id="dayTitle"></h2>
  <ul id="day"></ul>
  <h2>Celý týden</h2>
  <div class="wrap"><table id="week"></table></div>
</main>
<script>
// ===== DATA =====
const T=[["7:00","7:45"],["7:55","8:40"],["8:45","9:30"],["9:45","10:30"],["10:35","11:20"],["11:30","12:15"],["12:20","13:05"],["13:10","13:55"],["14:00","14:45"],["14:50","15:35"]];
const S={I:"Informatika",D:"Dějepis",Aj:"Angličtina",Nj:"Němčina",M:"Matematika",F:"Fyzika",Z:"Zeměpis",Čj:"Čeština",Sv:"Společenské vědy",Ch:"Chemie",Bi:"Biologie",Tv:"Tělocvik",Vv:"Výtvarná výchova"};
// [od hodiny, do hodiny, předmět, učitel, učebna]; 1 = pondělí ... 5 = pátek
const R={
1:[[1,2,"I","Pd","VT1"],[3,3,"D","Kř","Sek"],[4,4,"Aj","Chi","Ter"],[5,5,"Nj","Pm","J2"]],
2:[[1,1,"M","Ša",""],[2,2,"F","Mu",""],[3,3,"Z","Ca","1.A"],[4,5,"Čj","Km",""],[6,6,"Nj","Pm","J1"],[8,8,"Sv","Ko","Kva"],[9,9,"Ch","Kd","Kva"]],
3:[[1,1,"Bi","Kd",""],[2,2,"Aj","Chi","J1"],[3,3,"Čj","Km","Sept"],[4,4,"M","Ša","Kva"],[6,7,"Tv","Ga","H1"]],
4:[[1,2,"Vv","To","At"],[3,3,"Čj","Km","Sex"],[4,4,"Aj","Chi",""],[5,5,"M","Ša","Kva"],[6,6,"Nj","Pm","Sek"],[8,8,"D","Kř",""],[9,9,"Z","Ca",""]],
5:[[1,1,"Sv","Ko","Sex"],[2,2,"Bi","Kd",""],[3,3,"F","Mu","Ter"],[4,4,"Ch","Kd",""],[5,5,"Nj","Pm","4.A"],[6,6,"Aj","Chi","J1"]]
};
const DAYS=["Neděle","Pondělí","Úterý","Středa","Čtvrtek","Pátek","Sobota"];
const RING_MS=8000;

// ===== ČAS (pro zkoušení: index.html?t=2026-10-13T07:54:50) =====
const q=new URLSearchParams(location.search).get("t");
const off=q?new Date(q)-Date.now():0;
const now=()=>Date.now()+off;

const at=(d,hm)=>{const [h,m]=hm.split(":");const x=new Date(d);x.setHours(+h,+m,0,0);return x.getTime()};
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();

function buildEvents(){
  const ev=[],base=new Date(now());base.setHours(12,0,0,0);
  for(let o=-1;o<=9;o++){
    const d=new Date(base);d.setDate(d.getDate()+o);
    (R[d.getDay()]||[]).forEach(b=>{
      ev.push({t:at(d,T[b[0]][0]),type:"s",b});
      ev.push({t:at(d,T[b[1]][1]),type:"e",b});
    });
  }
  return ev.sort((a,b)=>a.t-b.t);
}

const $=id=>document.getElementById(id);
const box=$("box");
const pad=n=>String(n).padStart(2,"0");
function fmt(s){
  const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;
  if(d>0)return d+" d "+h+":"+pad(m)+":"+pad(x);
  if(h>0)return h+":"+pad(m)+":"+pad(x);
  return pad(m)+":"+pad(x);
}
const blockTime=b=>T[b[0]][0]+"–"+T[b[1]][1];

let key="";
function renderLists(ref,n){
  const rd=new Date(ref.t),blocks=R[rd.getDay()]||[];
  const cur=blocks.findIndex(b=>n>=at(rd,T[b[0]][0])&&n<at(rd,T[b[1]][1]));
  const nxt=blocks.findIndex(b=>at(rd,T[b[0]][0])>n);
  const k=rd.toDateString()+cur+nxt+new Date(n).getDay();
  if(k===key)return;key=k;
  const isToday=sameDay(n,ref.t);
  $("dayTitle").textContent=isToday?"Dnes ("+DAYS[rd.getDay()].toLowerCase()+")":"Další den: "+DAYS[rd.getDay()].toLowerCase();
  $("day").innerHTML=blocks.map((b,i)=>{
    const cls=i===cur?"now":(i===nxt&&cur<0||i===nxt&&cur>=0&&nxt===cur+1&&false)?"next":(i===nxt?"next":"");
    return `<li class="${cls}"><time>${blockTime(b)}</time><b>${S[b[2]]||b[2]}</b><span>${[b[4],b[3]].filter(Boolean).join(" · ")}</span></li>`;
  }).join("")||'<li class="empty">Žádné hodiny</li>';
  // týden
  const td=new Date(n).getDay();
  let h='<tr><th></th>'+[1,2,3,4,5].map(d=>`<th class="${d===td?"today":""}">${DAYS[d].slice(0,2)}</th>`).join("")+"</tr>";
  for(let r=1;r<=9;r++){
    h+=`<tr><td class="h">${r}.<br>${T[r][0]}</td>`;
    for(let d=1;d<=5;d++){
      const bs=R[d],st=bs.find(b=>b[0]===r);
      if(st){
        h+=`<td class="l ${d===td?"today":""}" rowspan="${st[1]-st[0]+1}" title="${S[st[2]]||""}"><b>${st[2]}</b><small>${st[4]||""}</small></td>`;
      }else if(!bs.some(b=>r>b[0]&&r<=b[1]))h+="<td></td>";
    }
    h+="</tr>";
  }
  $("week").innerHTML=h;
}

function tick(){
  const n=now(),ev=buildEvents();
  const ring=ev.find(e=>n>=e.t&&n<e.t+RING_MS);
  const next=ev.find(e=>e.t>n);
  if(ring){
    box.classList.add("ring");$("time").textContent="ZVONÍ!";
    document.title="ZVONÍ!";
  }else if(next){
    box.classList.remove("ring");
    const s=Math.ceil((next.t-n)/1000);
    $("time").textContent=fmt(s);
    document.title=fmt(s);
    $("label").textContent=next.type==="e"?"Do konce hodiny":"Do začátku hodiny";
    const b=next.b;
    $("info").innerHTML=next.type==="s"?`<b>${S[b[2]]||b[2]}</b>${b[4]?"<br>"+b[4]:""}`:"";
  }
  const ref=ring||next;
  if(ref)renderLists(ref,n);
}

box.addEventListener("click",()=>{
  if(document.fullscreenElement)document.exitFullscreen();
  else if(box.requestFullscreen)box.requestFullscreen();
});
tick();setInterval(tick,250);
</script>
</body>
</html>
